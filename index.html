<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Firefly Lens</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%234f46e5'/%3E%3Crect x='8' y='16' width='4' height='8' rx='1' fill='%23fff'/%3E%3Crect x='14' y='11' width='4' height='13' rx='1' fill='%23fff'/%3E%3Crect x='20' y='7' width='4' height='17' rx='1' fill='%23fff'/%3E%3C/svg%3E">
<script>
  try {
    var t = localStorage.getItem('ff-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    document.documentElement.dataset.theme = t;
  } catch (e) { document.documentElement.dataset.theme = 'dark'; }
</script>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<section id="import" class="import">
  <div class="import-card">
    <div class="logo-lg">
      <svg viewBox="0 0 32 32" width="40" height="40" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#4f46e5"/><rect x="8" y="16" width="4" height="8" rx="1" fill="#fff"/><rect x="14" y="11" width="4" height="13" rx="1" fill="#fff"/><rect x="20" y="7" width="4" height="17" rx="1" fill="#fff"/></svg>
      <h1>Firefly Lens</h1>
    </div>
    <p class="lead">Explore your Firefly III transaction export: balances, cash flow, spending and trends, all interactive.</p>
    <label id="drop" class="drop" tabindex="0">
      <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
      <strong>Drop your CSV export here</strong>
      <span>or click to choose one or more files</span>
    </label>
    <p id="import-error" class="import-error" hidden></p>
    <p class="privacy">Everything runs locally in your browser. Nothing is uploaded or stored.</p>
  </div>
</section>

<div id="app" class="app" hidden>
  <header class="topbar">
    <button class="icon-btn only-mobile" data-act="toggleSidebar" title="Filters" aria-label="Toggle filters">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M7 12h10M10 18h4"/></svg>
    </button>
    <div class="brand">
      <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#4f46e5"/><rect x="8" y="16" width="4" height="8" rx="1" fill="#fff"/><rect x="14" y="11" width="4" height="13" rx="1" fill="#fff"/><rect x="20" y="7" width="4" height="17" rx="1" fill="#fff"/></svg>
      <span>Firefly Lens</span>
    </div>
    <div class="search">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search description, notes, tags, accounts..." autocomplete="off">
    </div>
    <div class="top-meta" id="meta"></div>
    <button class="btn" data-act="newFile">Open CSV</button>
    <button class="icon-btn" data-act="theme" title="Toggle theme" aria-label="Toggle theme">
      <svg id="theme-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </header>
  <aside id="sidebar" class="sidebar"></aside>
  <div id="scrim" class="scrim" data-act="toggleSidebar"></div>
  <main class="main">
    <div id="chips" class="chips"></div>
    <nav id="tabs" class="tabs"></nav>
    <div id="view" class="view"></div>
  </main>
</div>

<aside id="drawer" class="drawer" aria-hidden="true"></aside>
<div id="drawer-scrim" class="drawer-scrim" data-act="closeDrawer"></div>
<div id="tooltip"></div>
<input type="file" id="file" accept=".csv,text/csv,text/plain" multiple hidden>
<div id="dropveil" class="dropveil">Drop CSV to load</div>

<script src="js/csv.js"></script>
<script src="js/model.js"></script>
<script src="js/charts.js"></script>
<script src="js/views.js"></script>
<script src="js/views2.js"></script>
<script src="js/app.js"></script>
</body>
</html>
